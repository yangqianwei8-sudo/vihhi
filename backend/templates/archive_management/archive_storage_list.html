{% extends "shared/module_base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/common.css' %}">
{% endblock %}

{% block title %}档案库管理 - 档案管理{% endblock %}



{% block module_content %}
<div class="list-page-container">
    <div class="card">
        <div class="card-header">
            <h3>📚 档案库管理</h3>
            <div>
                <a href="{% url 'archive_management:project_archive_list' %}" class="btn btn-light btn-sm">返回首页</a>
            </div>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <div class="card">
                        <div class="card-body">
                            <h5>库房管理</h5>
                            <p class="text-muted">管理档案库房信息</p>
                            <a href="{% url 'archive_management:archive_storage_room_list' %}" class="btn btn-primary">进入库房管理</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="card">
                        <div class="card-body">
                            <h5>位置管理</h5>
                            <p class="text-muted">管理档案位置信息</p>
                            <a href="{% url 'archive_management:archive_location_list' %}" class="btn btn-primary">进入位置管理</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="card">
                        <div class="card-body">
                            <h5>档案上架</h5>
                            <p class="text-muted">档案上架管理</p>
                            <a href="{% url 'archive_management:archive_shelf_list' %}" class="btn btn-primary">进入上架管理</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="card">
                        <div class="card-body">
                            <h5>档案盘点</h5>
                            <p class="text-muted">档案盘点管理</p>
                            <a href="{% url 'archive_management:archive_inventory_list' %}" class="btn btn-primary">进入盘点管理</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
