{% if form.errors %}
<div class="alert alert-danger mb-3" role="alert">
  <strong>提交失败：请完善必填项</strong>
  <ul class="mb-0 ps-3 mt-2">
    {% for field in form %}
      {% if field.errors %}
        <li><strong>{{ field.label }}</strong>：{{ field.errors|striptags }}</li>
      {% endif %}
    {% endfor %}
  </ul>
</div>
{% endif %}
