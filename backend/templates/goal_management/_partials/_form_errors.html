{% if form.errors %}
  <div style="background:#fff4f4;border:1px solid #f5c2c7;color:#b02a37;
              padding:12px;border-radius:10px;margin-bottom:12px;">
    <div style="font-weight:700;margin-bottom:6px;">提交失败：请完善必填项</div>

    {% if form.non_field_errors %}
      <div style="margin:6px 0;">{{ form.non_field_errors }}</div>
    {% endif %}

    <ul style="margin:0;padding-left:18px;">
      {% for field in form %}
        {% if field.errors %}
          <li><b>{{ field.label }}</b>：{{ field.errors|striptags }}</li>
        {% endif %}
      {% endfor %}
    </ul>
  </div>
{% endif %}
