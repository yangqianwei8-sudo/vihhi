<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
  {% for field in form %}
    <div style="display:flex;flex-direction:column;gap:6px;
                {% if field.field.widget.input_type == 'checkbox' %}grid-column:1 / -1;{% endif %}
                {% if field.errors %}border:1px solid #f5c2c7;padding:10px;border-radius:10px;background:#fff7f7;{% endif %}">
      <label style="font-weight:600;color:#333;">{{ field.label }}</label>

      <div>
        {{ field }}
      </div>

      {% if field.help_text %}
        <div style="color:#666;font-size:12px;">{{ field.help_text }}</div>
      {% endif %}

      {% if field.errors %}
        <div style="color:#b02a37;font-size:12px;">{{ field.errors }}</div>
      {% endif %}
    </div>
  {% endfor %}
</div>
