{% extends "shared/module_base.html" %}
{% load static %}

{% block module_content %}
<div class="container-fluid py-4">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">{{ page_title }}</h5>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">所属阶段 <span class="text-danger">*</span></label>
                            <select name="stage" class="form-select" required>
                                <option value="">请选择阶段</option>
                                {% for stage in stages %}
                                <option value="{{ stage.id }}" {% if milestone.stage_id == stage.id %}selected{% endif %}>
                                    {{ stage.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">里程碑名称 <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" value="{{ milestone.name|default:'' }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">里程碑编码 <span class="text-danger">*</span></label>
                            <input type="text" name="code" class="form-control" value="{{ milestone.code|default:'' }}" required>
                            <small class="text-muted">唯一标识，例如：opportunity_achievement</small>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">里程碑比例(%) <span class="text-danger">*</span></label>
                                <input type="number" name="milestone_percentage" class="form-control" 
                                       value="{{ milestone.milestone_percentage|default:'0' }}" 
                                       step="0.01" min="0" max="100" required>
                                <small class="text-muted">该里程碑在该阶段内的比例</small>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">排序</label>
                                <input type="number" name="order" class="form-control" 
                                       value="{{ milestone.order|default:'0' }}" min="0">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">里程碑描述</label>
                            <textarea name="description" class="form-control" rows="3">{{ milestone.description|default:'' }}</textarea>
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="is_active" id="is_active" 
                                       {% if not milestone or milestone.is_active %}checked{% endif %}>
                                <label class="form-check-label" for="is_active">
                                    启用
                                </label>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'settlement_pages:output_value_milestone_list' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> 返回列表
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> 保存
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
