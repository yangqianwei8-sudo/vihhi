{% extends "shared/base.html" %}
{% load static %}

{% block title %}确认收取错误 - 维海科技信息化管理平台{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/common.css' %}">
<style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .error-container {
        max-width: 500px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        padding: 40px;
        text-align: center;
    }
    
    .error-icon {
        font-size: 64px;
        margin-bottom: 20px;
    }
    
    .error-title {
        font-size: 24px;
        color: #dc3545;
        margin-bottom: 15px;
    }
    
    .error-message {
        color: #6c757d;
        margin-bottom: 30px;
        line-height: 1.6;
    }
    
    .back-link {
        display: inline-block;
        padding: 10px 20px;
        background: #667eea;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        transition: background 0.3s;
    }
    
    .back-link:hover {
        background: #5568d3;
        color: white;
    }
</style>
{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-icon">❌</div>
    <h1 class="error-title">确认收取失败</h1>
    <p class="error-message">{{ error_message|default:"系统错误，请稍后重试。" }}</p>
    <a href="javascript:history.back()" class="back-link">返回</a>
</div>
{% endblock %}
