    <header class="main-header">
        <div class="header-container d-flex justify-content-between align-items-center">
            <!-- 左侧：品牌标识 -->
            <div class="brand-section">
                <a href="#" class="brand-logo">
                    <div class="logo-icon">
                        <i class="bi bi-building"></i>
                    </div>
                    <div class="logo-text">
                        <div class="logo-title">维海科技</div>
                        <div class="logo-subtitle">信息化管理平台</div>
                    </div>
                </a>
            </div>
            
            <!-- 中间：搜索框 -->
            <div class="search-box d-none d-lg-block">
                <div class="input-group">
                    <input type="text" class="form-control" 
                           placeholder="搜索模块、客户、合同、文档..." 
                           id="global-search"
                           aria-label="搜索框">
                    <span class="input-group-text">
                        <i class="bi bi-search"></i>
                    </span>
                </div>
            </div>
            
            <!-- 右侧：用户操作 -->
            <div class="header-actions">
                <!-- 移动端搜索按钮 -->
                <button class="btn-icon d-lg-none" id="mobile-search-btn" title="搜索">
                    <i class="bi bi-search"></i>
                </button>
                
                <!-- 快速操作按钮 -->
                <button class="btn-icon d-none d-md-flex" id="quick-create" title="快速新建">
                    <i class="bi bi-plus-lg"></i>
                </button>
                
                <button class="btn-icon d-none d-md-flex" title="数据导入">
                    <i class="bi bi-upload"></i>
                </button>
                
                <!-- 通知按钮 -->
                <button class="btn-icon position-relative" id="notification-btn" title="通知中心">
                    <i class="bi bi-bell"></i>
                    <span class="badge bg-danger">
                        5
                        <span class="visually-hidden">未读通知</span>
                    </span>
                </button>
                
                <!-- 用户信息 -->
                <div class="dropdown">
                    <button class="btn user-dropdown dropdown-toggle" type="button" 
                            data-bs-toggle="dropdown" aria-expanded="false"
                            aria-label="用户菜单">
                        <div class="user-avatar online">
                            张
                        </div>
                        <div class="user-info d-none d-lg-block">
                            <span class="user-name">张三</span>
                            <span class="user-role">超级管理员</span>
                        </div>
                        <i class="bi bi-chevron-down d-none d-lg-block"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-lg" aria-labelledby="userDropdown">
                        <li><h6 class="dropdown-header">账户信息</h6></li>
                        <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>个人中心</a></li>
                        <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>账户设置</a></li>
                        <li><a class="dropdown-item" href="#"><i class="bi bi-shield-check me-2"></i>安全中心</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#"><i class="bi bi-moon me-2"></i>深色模式</a></li>
                        <li><a class="dropdown-item" href="#"><i class="bi bi-translate me-2"></i>语言设置</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="/logout/"><i class="bi bi-box-arrow-right me-2"></i>退出登录</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>
