{% comment %}
工作区 CSS 资源片段 (Workspace CSS Resources Partial)

功能说明：
- 负责加载工作区所需的 CSS 资源

使用方式：
- 在 extra_css 块中 include

资源说明：
- workspace.css: 工作区布局样式（必须）

注意：
- 此片段仅包含 CSS 资源
- JavaScript 资源由 _workspace_scripts.html 负责
- 布局结构由 _workspace_layout.html 负责
{% endcomment %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/layouts/workspace.css' %}">
