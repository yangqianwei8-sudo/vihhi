{% comment %}
列表行复选框单元格 - 与 list_page_base 的 show_list_checkboxes 配合使用。
参数: row_id (必填), checkbox_name (默认 item_ids), id_prefix (默认 item_)
{% endcomment %}
<td style="width: 50px;">
  <input type="checkbox" class="form-check-input row-checkbox" name="{{ checkbox_name|default:'item_ids' }}" value="{{ row_id }}" id="{{ id_prefix|default:'item_' }}{{ row_id }}" title="选择">
</td>
