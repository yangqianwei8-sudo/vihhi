{% comment %}
侧边栏顶部区域模板 - 可选搜索功能
按照总工作台风格，搜索功能已移除，标题区域在 base.html 中定义
{% endcomment %}

{% if sidebar_show_search|default:False %}
<div class="sidebar-header">
    <div class="sidebar-search">
        <input type="search" 
               class="sidebar-search-input"
               id="sidebar-search-input"
               placeholder="搜索菜单..."
               aria-label="搜索菜单"
               autocomplete="off">
        <div class="sidebar-search-results" id="sidebar-search-results" hidden></div>
    </div>
</div>
{% endif %}
