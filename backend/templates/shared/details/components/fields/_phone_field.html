{% comment %}
电话字段组件
用于显示电话号码
{% endcomment %}
<div class="detail-field detail-field-phone detail-field-span-{{ field.span|default:12 }}">
    <span class="detail-field-label">{{ field.label }}</span>
    <span class="detail-field-value">
        {% if value and value != "—" %}
            <a href="tel:{{ value }}" class="info-value-link">
                <i class="bi bi-telephone me-1"></i>
                {{ value }}
            </a>
        {% else %}
            —
        {% endif %}
    </span>
</div>
