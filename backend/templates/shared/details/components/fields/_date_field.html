{% comment %}
日期字段组件
用于显示日期和日期时间字段
{% endcomment %}
<div class="detail-field detail-field-date detail-field-span-{{ field.span|default:12 }}">
    <span class="detail-field-label">{{ field.label }}</span>
    <span class="detail-field-value">
        {% if value and value != "—" %}
            {% if field.format == 'date' %}
                {{ value|date:"Y-m-d" }}
            {% else %}
                {{ value|date:"Y-m-d H:i:s" }}
            {% endif %}
        {% else %}
            —
        {% endif %}
    </span>
</div>
