{% comment %}
标签字段组件
用于显示标签列表
{% endcomment %}
<div class="detail-field detail-field-tag detail-field-span-{{ field.span|default:12 }}">
    <span class="detail-field-label">{{ field.label }}</span>
    <span class="detail-field-value">
        {% if value and value != "—" %}
            {% if value|length > 0 %}
                {% for tag in value %}
                    <span class="badge bg-info me-1">{{ tag }}</span>
                {% endfor %}
            {% else %}
                {{ value }}
            {% endif %}
        {% else %}
            —
        {% endif %}
    </span>
</div>
