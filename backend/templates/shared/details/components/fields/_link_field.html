{% comment %}
链接字段组件
用于显示链接字段
支持文件下载链接
{% endcomment %}
<div class="detail-field detail-field-link detail-field-span-{{ field.span|default:12 }}">
    <span class="detail-field-label">{{ field.label }}</span>
    <span class="detail-field-value">
        {% if value and value != "—" %}
            {% if field.id == 'attachment.url' %}
                <a href="{{ value }}" target="_blank" class="btn btn-outline-primary btn-sm">
                    <i class="bi bi-download"></i> 下载附件
                </a>
            {% else %}
                <a href="{{ value }}" target="_blank" class="info-value-link">
                    {{ value }}
                    <i class="bi bi-box-arrow-up-right ms-1"></i>
                </a>
            {% endif %}
        {% else %}
            —
        {% endif %}
    </span>
</div>
