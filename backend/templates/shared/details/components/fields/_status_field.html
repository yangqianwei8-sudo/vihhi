{% comment %}
状态字段组件
用于显示状态徽章
{% endcomment %}
<div class="detail-field detail-field-status detail-field-span-{{ field.span|default:12 }}">
    <span class="detail-field-label">{{ field.label }}</span>
    <span class="detail-field-value">
        {% if value and value != "—" %}
            <span class="badge bg-secondary">{{ value }}</span>
        {% else %}
            —
        {% endif %}
    </span>
</div>
