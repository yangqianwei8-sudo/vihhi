{% comment %}
邮箱字段组件
用于显示邮箱地址
{% endcomment %}
<div class="detail-field detail-field-email detail-field-span-{{ field.span|default:12 }}">
    <span class="detail-field-label">{{ field.label }}</span>
    <span class="detail-field-value">
        {% if value and value != "—" %}
            <a href="mailto:{{ value }}" class="info-value-link">
                <i class="bi bi-envelope me-1"></i>
                {{ value }}
            </a>
        {% else %}
            —
        {% endif %}
    </span>
</div>
