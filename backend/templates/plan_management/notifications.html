{% extends "shared/base.html" %}
{% load static %}

{% block title %}通知中心 - 维海科技信息化管理平台{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/common.css' %}">
<style>
    .table-warning {
        background-color: #fff3cd;
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>通知中心</h4>
    <button id="mark-all-read" class="btn btn-sm btn-outline-secondary">
      全部标为已读
    </button>
  </div>

  <table class="table table-hover">
    <thead>
      <tr>
        <th>标题</th>
        <th>内容</th>
        <th>时间</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="notification-list">
      <tr><td colspan="4" class="text-muted">加载中…</td></tr>
    </tbody>
  </table>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
const tbody = document.getElementById('notification-list')
const csrftoken = document.cookie.match(/csrftoken=([^;]+)/)?.[1] || ''

function loadNotifications() {
  fetch('/api/plan/notifications/', {
    method: 'GET',
    headers: {
      'Accept': 'application/json',
      'X-Requested-With': 'XMLHttpRequest'
    },
    credentials: 'same-origin'
  })
    .then(r => {
      if (!r.ok) {
        throw new Error(`HTTP error! status: ${r.status}`)
      }
      return r.json()
    })
    .then(data => {
      if (!data.results || !data.results.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-muted">暂无通知</td></tr>'
        return
      }

      tbody.innerHTML = data.results.map(n => {
        const actions = []
        if (!n.is_read) {
          actions.push(`<button class="btn btn-sm btn-link" onclick="markRead(${n.id})">标为已读</button>`)
        }
        if (n.url) {
          // 转义URL中的单引号，避免XSS
          const safeUrl = (n.url || '').replace(/'/g, "\\'")
          actions.push(`<button class="btn btn-sm btn-primary" onclick="handleViewDetail(${n.id}, '${safeUrl}')">查看详情</button>`)
        }
        return `
        <tr class="${n.is_read ? '' : 'table-warning'}">
          <td>${escapeHtml(n.title || '')}</td>
          <td>${escapeHtml(n.content || '')}</td>
          <td>${new Date(n.created_at).toLocaleString()}</td>
          <td>${actions.join(' ')}</td>
        </tr>
      `
      }).join('')
    })
    .catch(err => {
      console.error('加载通知失败:', err)
      tbody.innerHTML = '<tr><td colspan="4" class="text-danger">加载失败，请刷新重试</td></tr>'
    })
}

// HTML转义函数，防止XSS
function escapeHtml(text) {
  const div = document.createElement('div')
  div.textContent = text
  return div.innerHTML
}

// C3-3-4: 更新顶部 badge 的通用函数
function updateBadge() {
  const badge = document.getElementById('notification-badge')
  if (!badge) return
  
  fetch('/api/plan/notifications/unread-count/', {
    method: 'GET',
    headers: {
      'Accept': 'application/json',
      'X-Requested-With': 'XMLHttpRequest'
    },
    credentials: 'same-origin'
  })
    .then(r => {
      if (!r.ok) {
        throw new Error(`HTTP error! status: ${r.status}`)
      }
      return r.json()
    })
    .then(data => {
      if (data.unread > 0) {
        badge.textContent = data.unread
        badge.style.display = 'inline-block'
      } else {
        badge.style.display = 'none'
      }
    })
    .catch(err => {
      // 静默失败，不影响页面
      console.error('更新通知徽章失败:', err)
    })
}

function markRead(id) {
  fetch(`/api/plan/notifications/${id}/mark-read/`, {
    method: 'POST',
    headers: {
      'X-CSRFToken': csrftoken,
      'Content-Type': 'application/json',
      'Accept': 'application/json'
    },
    credentials: 'same-origin'
  })
    .then(r => {
      if (!r.ok) {
        if (r.status === 403) {
          throw new Error('你没有权限，请联系管理员')
        } else if (r.status === 400 || r.status === 404) {
          return r.json().then(data => {
            throw new Error(data.detail || data.message || '操作失败')
          })
        }
        throw new Error('操作失败，请重试')
      }
      return r.json()
    })
    .then(() => {
      loadNotifications()
      updateBadge()
    })
    .catch(err => {
      console.error('标记已读失败:', err)
      alert(err.message || '标记失败，请重试')
    })
}

// C3-3-3: 查看详情（先标记已读再跳转）
function handleViewDetail(id, url) {
  if (!url) {
    alert('无法跳转：该通知没有关联的详情页')
    return
  }
  
  // 先标记已读
  fetch(`/api/plan/notifications/${id}/mark-read/`, {
    method: 'POST',
    headers: {
      'X-CSRFToken': csrftoken,
      'Content-Type': 'application/json',
      'Accept': 'application/json'
    },
    credentials: 'same-origin'
  })
    .then(r => {
      if (!r.ok) {
        if (r.status === 403) {
          throw new Error('你没有权限，请联系管理员')
        } else if (r.status === 400 || r.status === 404) {
          return r.json().then(data => {
            throw new Error(data.detail || data.message || '操作失败')
          })
        }
        throw new Error('标记失败，请重试')
      }
      return r.json()
    })
    .then(() => {
      // 更新 badge
      updateBadge()
      // 跳转到详情页
      window.location.href = url
    })
    .catch(err => {
      console.error('查看详情失败:', err)
      alert(err.message || '操作失败，请重试')
    })
}

document.getElementById('mark-all-read').onclick = function () {
  if (!confirm('确定要将所有通知标记为已读吗？')) {
    return
  }
  
  fetch('/api/plan/notifications/mark-all-read/', {
    method: 'POST',
    headers: {
      'X-CSRFToken': csrftoken,
      'Content-Type': 'application/json',
      'Accept': 'application/json'
    },
    credentials: 'same-origin'
  })
    .then(r => {
      if (!r.ok) {
        if (r.status === 403) {
          throw new Error('你没有权限，请联系管理员')
        } else if (r.status === 400) {
          return r.json().then(data => {
            throw new Error(data.detail || data.message || '操作失败')
          })
        }
        throw new Error('操作失败，请重试')
      }
      return r.json()
    })
    .then(() => {
      loadNotifications()
      updateBadge()
    })
    .catch(err => {
      console.error('全部标记已读失败:', err)
      alert(err.message || '操作失败，请重试')
    })
}

loadNotifications()
</script>
{% endblock %}
